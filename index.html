<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreenWave</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="app">
        <section class="welcome-screen">
            <div class="content">
                <div class="logo-container">
                    <img src="logo.png" alt="Logo de GreenWave" class="logo">
                </div>

                <h1 class="app-title">GREENWAVE</h1>

                <div class="buttons-container">
                    <button class="btn btn-primary" id="loginBtn">Iniciar Sesión</button>
                    <button class="btn btn-secondary" id="registerBtn">Crear Nueva Cuenta</button>
                </div>
            </div>
        </section>
    </main>

    <script src="java.js"></script>
</body>
</html>
